<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT-4G Smart Vehicle — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0f1417; --panel:#171e23; --line:#2a333a;
    --text:#e7edf0; --dim:#7c8992; --amber:#e8a33d; --green:#33d17a; --red:#e4574c; --blue:#4d8fe0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex;
    background:
      radial-gradient(ellipse 900px 500px at 85% 110%, #17222680, transparent),
      var(--bg);
    color:var(--text); font-family:'IBM Plex Sans',sans-serif;
  }
  .side{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:60px; border-right:1px solid var(--line);
  }
  .side h1{
    font-size:44px; line-height:1.15; margin:0 0 14px 0; font-weight:700;
  }
  .side p{ color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:13px; max-width:380px; }
  .form-wrap{
    width:420px; display:flex; align-items:center; justify-content:center; padding:40px;
  }
  .card{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:34px;
  }
  .card h2{ margin:0 0 22px 0; font-size:18px; font-weight:600; }
  label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); margin-bottom:6px; }
  .field{ margin-bottom:16px; position:relative; }
  input{
    width:100%; background:#0f1417; border:1px solid var(--line); border-radius:7px;
    color:var(--text); padding:11px 13px; font-size:14px; font-family:'IBM Plex Sans',sans-serif;
  }
  input:focus{ outline:none; border-color:var(--blue); }
  .eye{
    position:absolute; right:12px; top:35px; cursor:pointer; color:var(--dim); font-size:13px;
    user-select:none;
  }
  .row-between{ display:flex; justify-content:flex-end; margin:-6px 0 18px 0; }
  .row-between a{ color:var(--blue); font-size:12.5px; text-decoration:none; cursor:pointer; }
  button.primary{
    width:100%; background:var(--blue); border:none; color:#0b1116; font-weight:600;
    padding:12px; border-radius:7px; font-size:14.5px; cursor:pointer;
  }
  button.primary:hover{ filter:brightness(1.08); }
  button.primary:disabled{ opacity:0.6; cursor:default; }
  .msg{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; margin-top:14px; min-height:16px; }
  .msg.error{ color:var(--red); } .msg.ok{ color:var(--green); }
  .terms{ text-align:center; margin-top:24px; font-size:11.5px; color:var(--dim); }
  .terms a{ color:var(--dim); }
  @media(max-width:820px){ .side{display:none;} .form-wrap{width:100%;} }
</style>
</head>
<body>

  <div class="side">
    <h1>IoT-4G Based<br>Smart Utility<br>Vehicle</h1>
    <p>Command Center Access — Operator &amp; Admin</p>
  </div>

  <div class="form-wrap">
    <div class="card">
      <h2>Sign in</h2>

      <div class="field">
        <label>EMAIL</label>
        <input type="email" id="email" placeholder="operator1@iot4g.local" autocomplete="username">
      </div>

      <div class="field">
        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <span class="eye" id="eyeToggle">show</span>
      </div>

      <div class="row-between">
        <a id="forgotLink">Forgot password?</a>
      </div>

      <button class="primary" id="loginBtn">Login</button>
      <div class="msg" id="msg"></div>

      <div class="terms">By continuing you agree to this project's internal use terms.</div>
    </div>
  </div>

<script>
// ------------------------------------------------------------
// Fill these in from Firebase Console > Project settings > General
// > Your apps > SDK setup and configuration. databaseURL is already
// filled from what you gave.
// ------------------------------------------------------------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCeGwiHATO-1Dg4zY3nrbTzb0GG2h7Sm_A",
  authDomain: "iot-4g-based-smart-vehicle.firebaseapp.com",
  databaseURL: "https://iot-4g-based-smart-vehicle-default-rtdb.firebaseio.com",
  projectId: "iot-4g-based-smart-vehicle",
  appId: "1:6008451577:web:e9da521ece03e7b0c68d28"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const msgEl = document.getElementById('msg');
const loginBtn = document.getElementById('loginBtn');

document.getElementById('eyeToggle').onclick = () => {
  const isPw = passEl.type === 'password';
  passEl.type = isPw ? 'text' : 'password';
  document.getElementById('eyeToggle').textContent = isPw ? 'hide' : 'show';
};

document.getElementById('forgotLink').onclick = () => {
  const email = emailEl.value.trim();
  if(!email){ setMsg('Enter your email above first, then click Forgot password.', 'error'); return; }
  auth.sendPasswordResetEmail(email)
    .then(() => setMsg('Password reset email sent (only works for real, deliverable email addresses).', 'ok'))
    .catch(err => setMsg(err.message, 'error'));
};

loginBtn.onclick = () => {
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ setMsg('Enter both email and password.', 'error'); return; }

  loginBtn.disabled = true;
  auth.signInWithEmailAndPassword(email, password)
    .then(cred => db.ref('users/' + cred.user.uid).get())
    .then(snap => {
      const record = snap.val();
      if(!record){
        // No role record yet — see the admin bootstrap step in the setup notes.
        setMsg('No role assigned to this account yet. Ask an admin, or see bootstrap step.', 'error');
        return auth.signOut();
      }
      if(record.disabled){
        setMsg('This account has been disabled by an admin.', 'error');
        return auth.signOut();
      }
      window.location.href = record.role === 'staff' ? 'staff-app.html' : 'dashboard.html';
    })
    .catch(err => setMsg(err.message, 'error'))
    .finally(() => { loginBtn.disabled = false; });
};

function setMsg(text, kind){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + kind;
}

// If already logged in and valid, skip straight to dashboard
auth.onAuthStateChanged(user => {
  if(user){
    db.ref('users/' + user.uid).get().then(snap => {
      const r = snap.val();
      if(r && !r.disabled) window.location.href = r.role === 'staff' ? 'staff-app.html' : 'dashboard.html';
    });
  }
});
</script>
</body>
</html>
